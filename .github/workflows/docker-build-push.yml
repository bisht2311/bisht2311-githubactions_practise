name: Docker Build and Push
on: 
  workflow_dispatch:
    
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
      
      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker Build & Push to DockerHub
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/github_actions_app:latest
            ${{ vars.DOCKERHUB_USERNAME }}/github_actions_app:${{ github.repository }}
            ${{ vars.DOCKERHUB_USERNAME }}/github_actions_app:${{ github.sha }}_${{ github.head_ref }}


