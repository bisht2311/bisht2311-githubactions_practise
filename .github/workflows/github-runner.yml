name: GitHub Hosted Runners
on: workflow_dispatch

jobs:
  Runner-Info:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: ${{ matrix.os }} Runner Info
        run: |
          echo "Runner OS: ${{runner.os}}"
          echo "Hostname: $(hostname)"
          echo "Current user: $(whoami)"
        
      
