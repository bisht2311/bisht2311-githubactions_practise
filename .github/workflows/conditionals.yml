name: Conditional Workflow
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  conditional-checks:
    runs-on: ubuntu-latest
    steps:
      # 1. Runs only when the branch is main
      - name: Check if the branch is main
        if: github.ref_name == 'main'
        run: |
          echo "Branch is main"
      # 2. Runs when a previous step failed
      - name: Run when previous step failed
        if: failure()
        run: echo "Previous step failed"
  # 3. Job runs only on push events
  on-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Push only job
        run: echo "This job will run on push trigger only."
      # 4. Failure is allowed
      - name: Continue if an error occurs
        continue-on-error: true
        run: |
          echo "This step will fail"
          exit 1
      - name: Next step
        run: echo "This step still runs because the previous failure was allowed."
