name: Smart Triggers
on: 
  push:
    branches:
      - main
      - 'release/**'
    paths:
      - 'src/**'
      - 'app/**'
jobs:
  run-when-source-or-app-change:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Print message
        run: echo "Workflow triggered because src/ or app/ changed!"
