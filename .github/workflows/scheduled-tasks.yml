name: Schedule Tasks
on:
  schedule:
    - cron: "30 2 * * 1" # Every Monday at 2:30 AM UTC
    - cron: "0 */6 * * *" # Every 6 hours
  workflow_dispatch: 
jobs:
  schedule-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
      - name: Which schedule triggered?
        run: |
          if [ -z "${{ github.event.schedule }}" ]; then
            echo "Workflow triggered manually"
          else
            echo "Workflow triggered by cron schedule: ${{ github.event.schedule }}"
          fi
      - name: Check Health
        run: |
          status_code=$(curl -s -o /dev/null -w "%{http_code}" https://www.trainwithshubham.com/)

          if [[ "$status_code" -ne 200 ]]; then
            echo "Health Check: Failed :(!"
          else
            echo "Health Check: Passed :)"
          fi
