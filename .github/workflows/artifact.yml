name: Artifact Workflow
on: workflow_dispatch

jobs:
  provide-artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Artifact1
        run: |
          echo "This is the artifact data" > arti1.txt
      - name: Generate Artifact2
        run: |
          echo "This is the artifact data" > arti2.txt
      - name: Generate the directory
        run: |
          mkdir demo
          echo "This data is inside the demo directory" > demo/demo_file.txt
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: arti
          path: |
            arti1.txt
            arti2.txt
            demo/

  display-artifact-data:
    needs: 
      - provide-artifact
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: arti
      - name: Print artifact data
        run: |
          echo "=====1st Artifact Data===="
          cat arti1.txt
          echo "=====2nd Artifact Data====="
          cat arti2.txt
          echo "=====Directory Artifact File Data====="
          cat demo/demo_file.txt
          

            
